    quantity_role: Requirement
    population: {age: "major modifier", sex: "modifier", body_mass: "major modifier", body_composition: "major modifier", health_status: "major modifier", activity_level: "major modifier", climate: "major modifier", altitude: "modifier", pregnancy_lactation: "modifier", notes: "Clothing/shelter are delivery mechanisms, not intrinsic biological requirements in all environments."}
    threshold_type: [survival, physiological_stability, functional_performance, comfort]
    value: null
    range: null
    units: null
    assumptions: ["Baseline thermoregulatory physiology is functional at t0."]
    uncertainty: {type: [environmental, threshold], notes: "Safe ambient conditions cannot be expressed as one universal temperature because humidity, radiation, wind, clothing, activity and physiology interact."}
    limitations: ["A nominal normal core temperature is not a universal lethal threshold.", "Do not convert shelter into a universal consumable if the environment itself is already thermally compatible."]
