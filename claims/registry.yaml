schema_version: "0.1"
claims:
  - id: BIO-0001
    experiment_ids: [EXP-0001]
    claim: "Living human cells require continuous ATP turnover to sustain cellular work; whole-body viability therefore requires ongoing metabolic energy availability during the 24-hour observation window."
    claim_type: physiological_dependency
    status: proposed
    variable_or_dependency: cellular_energy_availability
    dependency_class: [Process, Flow]
    system_boundary: "Human organism, cellular metabolism"
    observation_window: "24 hours"
    replenishment_horizon: "Continuous ATP regeneration; external substrate replenishment may be longer than 24 hours when endogenous stores are available."
    quantity_role: Requirement
    population: {age: "all life stages", sex: "all", body_mass: "modifier", body_composition: "modifier", health_status: "modifier", activity_level: "major modifier", climate: "modifier via thermoregulation", altitude: "modifier", pregnancy_lactation: "major modifier", notes: "No universal ATP or energy-flow number asserted."}
    threshold_type: [survival, physiological_stability, functional_performance]
    value: null
    range: null
    units: null
    assumptions: ["Baseline metabolic machinery is functioning at t0."]
    uncertainty: {type: [scope, quantitative], notes: "Magnitude varies substantially with body size, composition, activity, illness and environment."}
    limitations: ["Does not equate cellular energy use with same-day food intake."]
    relationships: {supported_by: [REF-0002, REF-0023], challenged_by: [], depends_on: [], represented_by: [], used_by: [], supersedes: [], superseded_by: []}
    peom_implication: "Model energy as a continuous physiological flow supplied by internal and/or external substrates, not as a mandatory daily purchase."
    version: 1

  - id: BIO-0002
    experiment_ids: [EXP-0001]
    claim: "Aerobic ATP production in metabolically active tissues depends on continuing oxygen delivery through ventilation, gas exchange, blood oxygen carriage, perfusion and tissue diffusion. The lungs, oxygenated blood/hemoglobin and myoglobin provide finite short-duration oxygen inventories, but these cannot sustain whole-body metabolism across the 24-hour observation window without renewed environmental oxygen access."
    claim_type: physiological_dependency
    status: proposed
    variable_or_dependency: oxygen_delivery_to_tissues
    dependency_class: [Flow, Process, Capacity, Externally_mediated]
    system_boundary: "Atmosphere-to-mitochondria oxygen cascade"
    observation_window: "24 hours"
    replenishment_horizon: "Finite internal oxygen inventories can buffer short interruptions on seconds-to-minutes timescales; sustained 24-hour metabolism requires continuing environmental oxygen access."
    quantity_role: Requirement
    population: {age: "all", sex: "all", body_mass: "modifier", body_composition: "modifier", health_status: "major modifier", activity_level: "major modifier", climate: null, altitude: "major modifier via inspired PO2", pregnancy_lactation: "modifier", notes: "Required oxygen flux depends on metabolic rate."}
    threshold_type: [survival, physiological_stability, functional_performance]
    value: null
    range: null
    units: null
    assumptions: ["Hemoglobin, lungs, circulation and mitochondria are functional at t0."]
    uncertainty: {type: [threshold, quantitative], notes: "No universal inspired oxygen concentration or consumption rate is asserted; barometric pressure and physiology matter."}
    limitations: ["A sea-level resting VO2 example must not be treated as a universal minimum.", "Short-duration oxygen inventory must not be confused with a stock capable of sustaining the observation window."]
    relationships: {supported_by: [REF-0001, REF-0016, REF-0026], challenged_by: [RT-0001], depends_on: [BIO-0001], represented_by: [], used_by: [], supersedes: [], superseded_by: []}
    peom_implication: "The economic resource is access to a breathable oxygen environment, not a fixed daily quantity of bottled oxygen."
    version: 2

  - id: BIO-0003
    experiment_ids: [EXP-0001]
    claim: "Metabolic carbon dioxide must be continuously transported from tissues and eliminated through pulmonary ventilation sufficiently to keep CO2 and acid-base state within viable bounds."
    claim_type: physiological_dependency
    status: proposed
    variable_or_dependency: carbon_dioxide_elimination
    dependency_class: [Flow, Process, State, Capacity]
    system_boundary: "Cellular CO2 production through pulmonary exhalation"
    observation_window: "24 hours"
    replenishment_horizon: "Continuous elimination rather than replenishment."
    quantity_role: Output/Elimination
    population: {age: "all", sex: "all", body_mass: "modifier", body_composition: "modifier", health_status: "major modifier", activity_level: "major modifier", climate: null, altitude: "modifier", pregnancy_lactation: "modifier", notes: "CO2 production tracks substrate oxidation and metabolic rate."}
    threshold_type: [survival, physiological_stability, functional_performance]
    value: null
    range: null
    units: null
    assumptions: ["Respiratory control and gas transport are functional at t0."]
    uncertainty: {type: [quantitative], notes: "Required ventilation is state-dependent."}
    limitations: ["CO2 is a metabolic output whose controlled removal is required; it is not an external consumable requirement."]
    relationships: {supported_by: [REF-0015], challenged_by: [RT-0005], depends_on: [BIO-0001, BIO-0002], represented_by: [], used_by: [], supersedes: [], superseded_by: []}
    peom_implication: "Represent waste-gas removal as a physiological process enabled by a ventilatory environment."
    version: 2

  - id: BIO-0004
    experiment_ids: [EXP-0001]
    claim: "Adequate circulation and tissue perfusion are required capacities/processes for distributing oxygen, substrates, hormones and heat and for carrying metabolic products away from tissues."
