    value: null
    range: null
    units: null
    assumptions: ["Baseline cardiovascular structures exist at t0."]
    uncertainty: {type: [threshold, quantitative], notes: "Organ-specific critical perfusion thresholds differ."}
    limitations: ["Cardiac output averages are not minima."]
    relationships: {supported_by: [REF-0001, REF-0016], challenged_by: [], depends_on: [BIO-0002, BIO-0001], represented_by: [], used_by: [], supersedes: [], superseded_by: []}
