    status: proposed
    variable_or_dependency: tissue_perfusion
    dependency_class: [Process, Capacity, Flow]
    system_boundary: "Cardiovascular circulation"
    observation_window: "24 hours"
    replenishment_horizon: "Continuous function; capacity itself is not a consumable."
    quantity_role: Requirement
    population: {age: "all", sex: "all", body_mass: "modifier", body_composition: "modifier", health_status: "major modifier", activity_level: "major modifier", climate: "modifier", altitude: "modifier", pregnancy_lactation: "modifier", notes: null}
