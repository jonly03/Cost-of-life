    version: 1

  - id: BIO-0005
    experiment_ids: [EXP-0001]
    claim: "Body water is a pre-existing physiological stock whose volume and osmolality must remain within viable ranges. Water is continuously lost through urine, respiration, skin and feces; body-water balance can be supported by preformed water from beverages/food and by metabolic water generated during substrate oxidation. Required preformed external-water input is therefore conditional on initial hydration, metabolic water production and losses rather than being identical to 24-hour water loss."
    claim_type: physiological_dependency
    status: proposed
    variable_or_dependency: body_water_and_osmolality
    dependency_class: [Stock, State, Flow, Process]
    system_boundary: "Total body water, preformed external water exchange, and metabolic water production"
    observation_window: "24 hours"
    replenishment_horizon: "Hours to days depending on initial hydration, losses and access; tighter under heat, exertion, illness or other high-loss states."
    quantity_role: Replenishment
    population: {age: "major modifier", sex: "modifier", body_mass: "major modifier", body_composition: "major modifier", health_status: "major modifier", activity_level: "major modifier", climate: "major modifier", altitude: "modifier", pregnancy_lactation: "major modifier", notes: "Dietary water includes beverages and food moisture."}
    threshold_type: [survival, physiological_stability, functional_performance, long_term_health]
    value: null
    range: null
    units: null
    assumptions: ["Organism begins at t0 with nonzero body-water stock.", "Metabolic water is generated from oxidation of metabolic substrates and must not be double-counted as an independent external input."]
    uncertainty: {type: [threshold, individual_variability], notes: "Normal hydration occurs across a wide range of intakes; loss rates vary markedly."}
    limitations: ["National Academies Adequate Intake values are population intake references, not physiological survival minima.", "Do not equate total water AI with plain drinking-water requirement."]
    relationships: {supported_by: [REF-0004, REF-0013, REF-0019], challenged_by: [RT-0002], depends_on: [BIO-0004], represented_by: [], used_by: [], supersedes: [], superseded_by: []}
    peom_implication: "Model water as stock-and-flow with initial state, endogenous/metabolic water, food water, fluid intake and multiple loss pathways."
    version: 2

  - id: BIO-0006
    experiment_ids: [EXP-0001]
    claim: "Electrolyte concentration gradients, especially sodium-dominated extracellular and potassium-dominated intracellular compartments, are bounded physiological states required for membrane potentials, neuromuscular function, cardiac conduction, fluid balance and acid-base regulation."
    claim_type: physiological_dependency
    status: proposed
    variable_or_dependency: electrolyte_homeostasis
    dependency_class: [Stock, State, Process]
    system_boundary: "Whole-body electrolyte inventory plus explicitly distinguished compartment-specific electrolyte pools and transmembrane gradients"
    observation_window: "24 hours"
    replenishment_horizon: "Variable; depends on initial stores and net losses. Same-day dietary intake is not necessarily required to equal same-day turnover."
    quantity_role: Requirement
    population: {age: "modifier", sex: "modifier", body_mass: "modifier", body_composition: "modifier", health_status: "major modifier", activity_level: "major modifier through sweat", climate: "major modifier", altitude: "modifier", pregnancy_lactation: "modifier", notes: "Renal and hormonal control buffer intake variation."}
    threshold_type: [survival, physiological_stability, functional_performance]
    value: null
    range: null
    units: null
    assumptions: ["Kidney and endocrine regulation are functioning at t0."]
    uncertainty: {type: [threshold, replenishment_horizon], notes: "Requirement differs from dietary guidance and is strongly affected by abnormal losses and disease."}
    limitations: ["Serum concentration is a regulated state and not a direct proxy for total-body stock.", "Dietary sodium/potassium recommendations must not be treated as survival minima.", "Internal redistribution changes compartment inventories but does not change conserved whole-body electrolyte mass; downstream models must specify the stock boundary."]
    relationships: {supported_by: [REF-0004, REF-0005, REF-0015, REF-0019], challenged_by: [RT-0006], depends_on: [BIO-0005], represented_by: [], used_by: [], supersedes: [], superseded_by: []}
    peom_implication: "Represent electrolytes as regulated stocks/states with loss-dependent replenishment."
    version: 2

  - id: BIO-0007
    experiment_ids: [EXP-0001]
    claim: "A human organism requires oxidizable metabolic substrate over time, but a metabolically healthy adult at t0 can sustain substantial 24-hour energy demand from endogenous glycogen and adipose stores; therefore external caloric intake during every 24-hour window is not a universal immediate survival requirement."
    claim_type: physiological_dependency
    status: proposed
    variable_or_dependency: metabolic_substrate_availability
    dependency_class: [Stock, Flow, Process]
    system_boundary: "Endogenous glycogen and adipose energy stores, canonical body-protein/tissue inventory, plus external nutrient input"
    observation_window: "24 hours"
    replenishment_horizon: "From less than a day for some glycogen pools to days/weeks or longer for adipose energy; highly individual."
    quantity_role: Replenishment
    population: {age: "major modifier", sex: "modifier", body_mass: "major modifier", body_composition: "major modifier", health_status: "major modifier", activity_level: "major modifier", climate: "modifier", altitude: "modifier", pregnancy_lactation: "major modifier", notes: "The 24-hour fasting inference is scoped to metabolically stable individuals with adequate stores."}
    threshold_type: [survival, physiological_stability, functional_performance, long_term_health]
    value: null
    range: null
    units: null
    assumptions: ["Nonzero glycogen and fat stores at t0.", "No condition requiring continuous exogenous glucose or feeding."]
    uncertainty: {type: [population_scope, replenishment_horizon], notes: "Not applicable to all infants, frail individuals, some diseases, pregnancy/lactation states or severe catabolic stress."}
    limitations: ["No claim that fasting is healthy, comfortable or function-preserving for every person.", "No fixed daily calorie minimum is asserted.", "Body protein is one canonical physical tissue inventory that may contribute amino acids and oxidation substrate; it must not be duplicated as an independent energy reserve and amino-acid reserve."]
    relationships: {supported_by: [REF-0002, REF-0003, REF-0014, REF-0017], challenged_by: [RT-0007], depends_on: [BIO-0001], represented_by: [], used_by: [], supersedes: [], superseded_by: []}
    peom_implication: "Separate energy requirement from food-purchase cadence and caloric replenishment."
    version: 2

  - id: BIO-0008
    experiment_ids: [EXP-0001]
    claim: "Humans cannot synthesize nine indispensable amino acids and therefore require exogenous sources over an appropriate replenishment horizon for protein synthesis and nitrogen balance, but this biochemical dependency does not establish that all nine must be ingested within each arbitrary 24-hour window."
    claim_type: physiological_dependency
    status: proposed
    variable_or_dependency: indispensable_amino_acids
    dependency_class: [Flow, Stock, Process]
    system_boundary: "Protein turnover, amino-acid pools and exogenous amino-acid supply"
    observation_window: "24 hours"
    replenishment_horizon: "Unresolved in Biology_2; essentiality is established, but the evidence base does not yet justify a generic depletion or safe non-replenishment horizon."
    quantity_role: Replenishment
    population: {age: "major modifier", sex: "modifier", body_mass: "modifier", body_composition: "modifier", health_status: "major modifier", activity_level: "modifier", climate: null, altitude: null, pregnancy_lactation: "major modifier", notes: "Conditionally essential amino acids vary with growth, illness and stress."}
    threshold_type: [physiological_stability, functional_performance, long_term_health]
    value: null
    range: null
    units: null
    assumptions: ["A dynamic free amino-acid pool and body-protein/tissue inventory exist at t0; they are distinct physiological objects."]
    uncertainty: {type: [replenishment_horizon, population_scope], notes: "There is no dedicated amino-acid reserve analogous to adipose energy storage. Free amino-acid pools are dynamic; endogenous protein turnover can supply amino acids by mobilizing functional tissue, with physiological consequences."}
    limitations: ["Protein RDA is not treated as a survival minimum.", "Long-term necessity must not be calendar-forced into daily ingestion.", "Body protein must share one canonical inventory with any energy-substrate representation; proteolysis, synthesis, oxidation and nitrogen loss are transformations of that inventory, not independent reserves."]
    relationships: {supported_by: [REF-0003, REF-0024, REF-0025], challenged_by: [RT-0003, RT-0007], depends_on: [BIO-0001, BIO-0007], represented_by: [], used_by: [], supersedes: [], superseded_by: []}
    peom_implication: "Nutrient model needs essentiality plus reserve/turnover horizon, not just daily recommended intake."
    version: 2

