<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">VIS-0001 — Inventory Blindness</title>
<desc id="desc">Comparison between the invalid inference that observed use or loss implies same-window external replenishment and a stock-aware balance including initial stock, external input, internal production, and outputs.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#243447"/></marker>
<style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#17212b}.h1{font-size:46px;font-weight:800}.h2{font-size:28px;font-weight:750}.body{font-size:22px}.small{font-size:18px}.muted{fill:#607181}.bad{fill:#9a3d37}.good{fill:#325f59}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style></defs>
<rect width="1600" height="900" fill="#f7f5f0"/>
<text x="80" y="80" class="h1">Inventory Blindness</text>
<text x="82" y="122" class="body muted">The mistake: inferring external replenishment directly from observed use, loss, or turnover.</text>

<rect x="80" y="185" width="650" height="230" rx="30" fill="#f6e6e3" stroke="#b86d66" stroke-width="2"/>
<text x="115" y="230" class="h2 bad">The flat-list inference</text>
<rect x="120" y="275" width="205" height="72" rx="18" fill="#fff" stroke="#b86d66" stroke-width="2"/><text x="151" y="318" class="body">observed use / loss</text>
<line x1="325" y1="311" x2="445" y2="311" stroke="#243447" stroke-width="4" marker-end="url(#a)"/>
<rect x="445" y="275" width="230" height="72" rx="18" fill="#fff" stroke="#b86d66" stroke-width="2"/><text x="474" y="306" class="small">same-window external</text><text x="496" y="331" class="small">replacement required</text>
<line x1="360" y1="260" x2="530" y2="365" stroke="#9a3d37" stroke-width="12"/><line x1="530" y1="260" x2="360" y2="365" stroke="#9a3d37" stroke-width="12"/>

<rect x="790" y="185" width="730" height="230" rx="30" fill="#e4efeb" stroke="#658e85" stroke-width="2"/>
<text x="825" y="230" class="h2 good">The stock-aware question</text>
<text x="825" y="280" class="body mono">Later stock = Initial stock</text>
<text x="825" y="316" class="body mono">            + External inputs</text>
<text x="825" y="352" class="body mono">            + Internal production</text>
<text x="825" y="388" class="body mono">            − Outputs / use</text>

<text x="80" y="495" class="h2">Water example — structure known, quantity context-dependent</text>
<rect x="105" y="555" width="260" height="95" rx="22" fill="#f0e4cb" stroke="#9a8052" stroke-width="2"/>
<text x="145" y="594" class="body">initial body-water</text><text x="187" y="623" class="small muted">stock at t₀</text>

<rect x="455" y="505" width="250" height="78" rx="18" fill="#edf0df" stroke="#929b6a" stroke-width="2"/>
<text x="492" y="540" class="body">preformed water</text><text x="517" y="566" class="small muted">outside → inside</text>

<rect x="455" y="620" width="250" height="78" rx="18" fill="#dfe9ef" stroke="#6d8594" stroke-width="2"/>
<text x="500" y="655" class="body">metabolic water</text><text x="475" y="681" class="small muted">from substrate oxidation</text>

<line x1="365" y1="603" x2="805" y2="603" stroke="#243447" stroke-width="4" marker-end="url(#a)"/>
<line x1="705" y1="544" x2="805" y2="585" stroke="#243447" stroke-width="3" marker-end="url(#a)"/>
<line x1="705" y1="659" x2="805" y2="621" stroke="#243447" stroke-width="3" marker-end="url(#a)"/>

<rect x="805" y="545" width="275" height="116" rx="22" fill="#fff" stroke="#243447" stroke-width="3"/>
<text x="847" y="585" class="body">body-water state</text><text x="838" y="616" class="small muted">stock + osmolality remain</text><text x="877" y="642" class="small muted">within viable bounds</text>

<line x1="1080" y1="603" x2="1195" y2="603" stroke="#243447" stroke-width="4" marker-end="url(#a)"/>
<rect x="1195" y="535" width="285" height="136" rx="22" fill="#efe6e0" stroke="#a07e6e" stroke-width="2"/>
<text x="1235" y="574" class="body">losses / outputs</text>
<text x="1235" y="607" class="small">urine · respiration</text>
<text x="1235" y="635" class="small">skin · feces</text>

<rect x="110" y="735" width="1370" height="92" rx="22" fill="#fff8e9" stroke="#bd9551" stroke-width="2"/>
<text x="145" y="775" class="body"><tspan font-weight="750">Therefore:</tspan> observed 24-hour water loss does not, by itself, identify a universal 24-hour preformed-water intake.</text>
<text x="145" y="807" class="small muted">Initial hydration, metabolic production, losses, physiology, activity, climate, and other conditions matter. No universal number is implied.</text>
<text x="80" y="870" class="small muted">This balance is a visual grammar for stock-flow cases, not an equation asserted for every physiological variable.</text>
</svg>