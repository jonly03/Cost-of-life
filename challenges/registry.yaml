schema_version: "0.1"
challenges:
  - id: RT-0001
    experiment_ids: [EXP-0001]
    target_claim_ids: [BIO-0002, DATA-0004]
    challenge_type: source_to_claim_overreach
    challenge: "BIO-0002 says humans possess no physiologically meaningful oxygen store. That wording is stronger than the registered evidence supports and is literally misleading: oxygen is stored transiently in lungs, hemoglobin-bound blood and myoglobin. Those stores are small and cannot replace sustained environmental oxygen delivery, but they are physiologically meaningful over seconds-to-minutes and during apnea. DATA-0004 compounds the issue by assuming no meaningful oxygen inventory."
    severity: medium
    evidence:
      source_ids: [REF-0001, REF-0016]
    model_consequence_if_valid: "Omitting all oxygen inventory forces an instantaneous external-input model and cannot represent short interruptions, apnea, preoxygenation, or initial oxygen state. It does not invalidate the conclusion that sustained viability requires continuing oxygen access."
    proposed_resolution: "Revise BIO-0002 to distinguish finite short-duration internal oxygen stores from the absence of a store capable of sustaining 24-hour metabolism. In DATA-0004 permit a small O2 inventory/state when the modeled timescale requires it; leave magnitude unparameterized until evidence is registered."
    status: resolved
    resolution: "Resolved after Biology_2, Data_2 and Librarian_2. BIO-0002 now recognizes finite short-duration lung/blood/myoglobin oxygen inventories; DATA-0004 includes S_O2_short and explicitly leaves its magnitude unresolved; REF-0026 strengthens the narrow evidence basis. The original zero-inventory overreach is removed."
    relationships: {challenges: [BIO-0002, DATA-0004], supported_by: [REF-0001, REF-0016], resolved_by: []}

  - id: RT-0002
    experiment_ids: [EXP-0001]
    target_claim_ids: [BIO-0005, DATA-0005]
    challenge_type: stock_flow_and_source_to_claim_overreach
    challenge: "BIO-0005 states that water losses must eventually be replaced from external water contained in fluids and food. This excludes metabolic water as a source even though DATA-0005 explicitly includes F_metabolic. The biological requirement is maintenance/restoration of body-water state, not molecule-for-molecule replacement of losses by preformed external water."
    severity: high
    evidence:
      source_ids: [REF-0004, REF-0013, REF-0019]
    model_consequence_if_valid: "A downstream PEOM could overstate direct external water requirement by equating net water loss with preformed drinking/food water input and could double-count water embodied in oxidized substrate."
    proposed_resolution: "Revise BIO-0005 to say body-water balance can be supported by preformed water intake plus metabolic water, with required external preformed-water input conditional on initial state, metabolic production and losses. Keep DATA-0005's metabolic-water term and define its provenance from substrate oxidation."
    status: resolved
    resolution: "Resolved. BIO-0005 and DATA-0005 now distinguish preformed external water from metabolic water, trace metabolic water to substrate oxidation, and prohibit double counting it as an independent external resource. Librarian_2 sustains this correction."
    relationships: {challenges: [BIO-0005, DATA-0005], supported_by: [REF-0004, REF-0013, REF-0019], resolved_by: []}

  - id: RT-0003
    experiment_ids: [EXP-0001]
    target_claim_ids: [BIO-0008, DATA-0006]
    challenge_type: stock_category_error
    challenge: "The essential-amino-acid dependency is valid, but DATA-0006's generic nutrient stock S_n risks treating indispensable amino acids as if they had a dedicated reserve analogous to adipose or vitamin stores. The free amino-acid pool is dynamic and short-lived; fasting supply can come from turnover and catabolism of body protein, which is tissue with functional consequences, not a costless nutrient inventory."
    severity: high
    evidence:
      source_ids: [REF-0003]
    model_consequence_if_valid: "A generic stock model can overestimate available amino-acid reserve, hide lean-tissue depletion, and make the replenishment horizon appear longer or safer than the physiology supports."
    proposed_resolution: "For amino acids, separate free amino-acid pools from body-protein/tissue stocks and represent proteolysis, synthesis, oxidation and nitrogen loss explicitly. Do not assign a replenishment horizon until stronger turnover evidence is registered."
    status: resolved
    resolution: "Resolved structurally and evidentially. BIO-0008 and DATA-0006 distinguish dynamic free amino-acid pools from canonical body-protein/tissue stock; no generic costless amino-acid reserve or safe replenishment horizon is asserted. REF-0024 and REF-0025 strengthen turnover/proteolysis provenance."
    relationships: {challenges: [BIO-0008, DATA-0006], supported_by: [REF-0003], resolved_by: []}

  - id: RT-0004
    experiment_ids: [EXP-0001]
    target_claim_ids: [BIO-0009]
    challenge_type: unsupported_replenishment_horizon
    challenge: "BIO-0009 records the essential-fatty-acid replenishment horizon as 'longer than 24 hours under ordinary stocked conditions.' Evidence Base v0.1 explicitly says the exact healthy-person depletion horizon remains unresolved, while REF-0022 is primarily parenteral-nutrition deficiency literature. The qualitative anti-calendar conclusion is supportable; the >24-hour horizon for an ordinary stocked population is not yet adequately sourced in the registered corpus."
    severity: high
    evidence:
      source_ids: [REF-0003, REF-0022]
    model_consequence_if_valid: "The model could admit zero essential-fatty-acid input during W as evidence-backed for a population broader than the evidence supports, turning an unresolved horizon into a validated boundary condition."
    proposed_resolution: "Set BIO-0009 replenishment_horizon to unresolved/likely longer than the observation window only where directly supported, or register primary healthy-adult evidence before retaining the >24-hour assertion. Preserve the weaker claim that essentiality does not itself imply same-calendar-day ingestion."
    status: resolved
    resolution: "Resolved by retraction rather than parameterization. BIO-0009 now marks the essential-fatty-acid replenishment horizon unresolved and DATA-0006 refuses to infer H_n from essentiality or anti-calendar reasoning. Librarian_2 confirms that the >24-hour general-population horizon remains unverified."
    relationships: {challenges: [BIO-0009], supported_by: [REF-0003, REF-0022], resolved_by: []}

  - id: RT-0005
    experiment_ids: [EXP-0001]
    target_claim_ids: [BIO-0003, BIO-0012, DATA-0002]
    challenge_type: category_error
    challenge: "BIO-0003 and BIO-0012 label elimination/excretion as quantity_role 'Consumption', and DATA-0002 defines Consumption broadly enough to include elimination. That collapses materially different concepts: production/throughput, excretion/output, depletion of a stock, and consumption of an input. The distinction matters when the graph is later mapped to resources and costs."
    severity: high
    evidence:
      source_ids: [REF-0015, REF-0020]
    model_consequence_if_valid: "Downstream accounting can misclassify waste outputs as consumed resources, obscure mass balance, and create double counting when both substrate consumption and waste elimination are represented."
    proposed_resolution: "Add an Output/Elimination quantity role (or equivalent) distinct from Consumption. Reclassify CO2 elimination and renal excretion accordingly. Reserve Consumption for defined use/depletion semantics and document whether it applies to internal stock use, external input use, or both."
    status: resolved
    resolution: "Resolved for the scientific/model substrate. BIO-0003 and BIO-0012 use Output/Elimination; DATA-0002 and DATA-0008 distinguish Output/Elimination from Use/Consumption and Replenishment. A global terminology/schema normalization remains an Editor/Terminology follow-up but does not leave the original category error active in Biology_2/Data_2."
    relationships: {challenges: [BIO-0003, BIO-0012, DATA-0002], supported_by: [REF-0015, REF-0020], resolved_by: []}

  - id: RT-0006
    experiment_ids: [EXP-0001]
    target_claim_ids: [DATA-0005, BIO-0006]
    challenge_type: stock_flow_confusion
    challenge: "DATA-0005 defines S_electrolyte_n as a nutrient/compartment-specific electrolyte inventory but uses dS_electrolyte_n/dt = F_intake_n + F_internal_n - F_loss_n. If S is total-body inventory, internal redistribution cannot change it and F_internal_n double-counts conserved transfers. If S is compartment-specific, internal flows must be paired source/sink transfers between explicit compartments."
    severity: high
    evidence:
      source_ids: [REF-0004, REF-0005, REF-0015, REF-0019]
    model_consequence_if_valid: "The current equation can create or destroy electrolyte mass mathematically, violating conservation and corrupting both stock estimates and replenishment calculations."
    proposed_resolution: "Choose the stock boundary explicitly. For total-body electrolyte stock, omit net internal transfer except true biochemical source/sink terms. For compartment stocks, model a transfer matrix whose internal flows sum to zero across the whole-body boundary."
    status: resolved
    resolution: "Resolved. BIO-0006 declares whole-body versus compartment boundaries; DATA-0005 supplies separate balance equations and an internal-transfer cancellation constraint. The original possibility of creating/destroying conserved electrolyte mass through an undifferentiated internal term is removed."
    relationships: {challenges: [DATA-0005, BIO-0006], supported_by: [REF-0004, REF-0005, REF-0015, REF-0019], resolved_by: []}

  - id: RT-0007
    experiment_ids: [EXP-0001]
    target_claim_ids: [DATA-0003, DATA-0006, BIO-0007, BIO-0008]
    challenge_type: double_counting
    challenge: "DATA-0003 introduces S_pro as mobilizable protein/tissue substrate while DATA-0006 can independently introduce nutrient stocks for amino acids. Without an ownership rule, the same body protein can be counted once as energy substrate reserve and again as an indispensable-amino-acid reserve."
    severity: high
    evidence:
      source_ids: [REF-0002, REF-0003, REF-0014, REF-0017]
    model_consequence_if_valid: "Reserve availability can be overstated and mass/energy/nitrogen accounting can diverge. A later cost model could treat one physical tissue inventory as two independent buffers."
    proposed_resolution: "Use one canonical body-protein stock (possibly tissue-indexed) with multiple outgoing transformations: amino-acid release, protein turnover and oxidation. DATA-0003 and DATA-0006 should reference the same stock rather than instantiate independent reserves."
    status: resolved
    resolution: "Resolved. BIO-0007/BIO-0008 and DATA-0003/DATA-0006 now share one canonical body-protein/tissue inventory. Energy oxidation and amino-acid release are transformations/outflows from that same stock. REF-0024/REF-0025 strengthen the physiological basis."
    relationships: {challenges: [DATA-0003, DATA-0006, BIO-0007, BIO-0008], supported_by: [REF-0002, REF-0003, REF-0014, REF-0017], resolved_by: []}

  - id: RT-0008
    experiment_ids: [EXP-0001]
    target_claim_ids: [BIO-0014, DATA-0004, DATA-0007]
    challenge_type: unjustified_universality_and_incomplete_hazard_surface
    challenge: "BIO-0014 is defensible as a conceptual boundary-condition claim but is too broad for Validated-for-model-use as a complete viable-environment specification. Evidence Base v0.1 explicitly leaves contaminants, pressure bounds and other hazards incomplete. DATA-0004 and DATA-0007 cover respiratory and thermal dimensions but do not exhaust tissue-integrity hazards."
    severity: medium
    evidence:
      source_ids: [REF-0001, REF-0011, REF-0012, REF-0016, REF-0021]
    model_consequence_if_valid: "Treating BIO-0014 as complete could falsely imply that the modeled environmental constraint set is exhaustive, causing omitted hazards to disappear from later resource/infrastructure mapping."
    proposed_resolution: "Validate BIO-0014 only as an umbrella/decomposition claim. Mark the environmental admissible set open-ended and require hazard-specific child claims before quantitative or completeness-sensitive use."
    status: resolved
    resolution: "Resolved by explicit scope restriction. BIO-0014 is now an open-ended umbrella/decomposition claim; DATA-0004 and DATA-0007 identify respiratory and thermal hazard surfaces as partial child models and cannot certify complete environmental viability. Quantitative hazard completeness remains future work, not an unresolved defect in the scoped claim."
    relationships: {challenges: [BIO-0014, DATA-0004, DATA-0007], supported_by: [REF-0001, REF-0011, REF-0012, REF-0016, REF-0021], resolved_by: []}


  - id: RT-0009
    experiment_ids: [EXP-0001]
    target_claim_ids: [BIO-0013, DATA-0008]
    artifact: BOTH
    challenge_type: cross_artifact_inconsistency
    location:
      PUB: "PUB-0001, section 'So what does a human need for 24 hours?' — sentence beginning 'Across a 24-hour period, continued human viability depends on...'"
      VIS: "VIS-0001-primary.svg, PROCESSES column — 'sleep / recovery' presented alongside ATP/metabolism, circulation, gas exchange and renal processing inside the undifferentiated organism system"
    challenge: "The public package partially collapses outcome layers. Canonical BIO-0013/DATA-0008 treat sleep/recovery in Wave 1 as a function/health dependency with no established acute 24-hour survival threshold. PUB-0001's synthesis sentence places 'longer-horizon nutrient and recovery dependencies' inside what 'continued human viability depends on' across 24 hours. VIS-0001 reinforces that reading by presenting sleep/recovery as a coequal process beside acute viability processes without an outcome-layer qualifier. Each artifact contains qualifying material elsewhere, but the dominant combined implication can promote function/health evidence into a viability requirement."
    severity: high
    evidence:
      source_ids: [REF-0010, REF-0018]
    canonical_objects: [BIO-0013, DATA-0008, TERM-0011, TERM-0013, TERM-0014]
    likely_public_misunderstanding: "A reasonable reader/viewer may conclude that Scientific Core v0.1 established sleep/recovery as an acute requirement for staying alive through the 24-hour observation window, rather than a function/health dependency whose quantitative sleep-state dynamics and acute survival threshold remain unresolved."
    model_consequence_if_valid: "Public translation would be stronger than Scientific Core v0.1 at the outcome layer and would undermine the explicit viability/function/health distinction."
    required_correction: "PUB: separate acute/viability dependencies from longer-horizon function/health dependencies in the summary sentence. VIS: qualify sleep/recovery as function/health or otherwise visually prevent it from reading as coequal evidence for 24-hour viability. No new threshold or redesign is required."
    status: resolved
    relationships: {challenges: [BIO-0013, DATA-0008], supported_by: [REF-0010, REF-0018], resolved_by: [PUB-0001, VIS-0001] }
    resolution: "Mechanical re-check passed. PUB-0001 now separates acute viability/stability dependencies from sleep/recovery evidence at function and longer-horizon health layers and explicitly denies a universal acute 24-hour sleep survival minimum. VIS-0001 now gives sleep/recovery a dashed/neutral process treatment with the explicit qualifier 'function / health', preventing coequal acute-viability interpretation. Combined 15-second test passes: a fast reader/viewer is no longer led to infer that Scientific Core v0.1 established sleep as an acute 24-hour survival requirement."
